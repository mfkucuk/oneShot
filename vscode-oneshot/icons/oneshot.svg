<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- OneShot: a bow and arrow, like the project's favicon -->
  <!-- Bow string, pulled back to the arrow's nock -->
  <path d="M5 1.5 L3.4 12.6 L14.5 11" fill="none" stroke="#8C8C8C" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- Bow -->
  <path d="M5 1.5 C 13 0.5, 15.5 4, 14.5 11" fill="none" stroke="#C47A3C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arrow shaft -->
  <path d="M3.4 12.6 L12 4" stroke="#A8A8A8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <path d="M14.8 1.2 L10.2 2.8 L13.2 5.8 Z" fill="#F0534B"/>
  <!-- Fletching: two feathers at the back of the arrow -->
  <path d="M6.2 9.8 L4 9.6 M6.2 9.8 L6.4 12 M4.8 11.2 L2.6 11 M4.8 11.2 L5 13.4" stroke="#F0534B" stroke-width="1.1" stroke-linecap="round"/>
</svg>
