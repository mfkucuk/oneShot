<!doctype html>
<html>
	<head>
    	<title>OneShot</title>
		<script src='oneShot.js'></script>
		<link rel="icon" href="favicon.ico" type="image/x-icon"/> 
	</head>
	<body>	
		<div style="display: flex;">
			<!-- Container for Textarea and Button -->
			<div style="display: flex; flex-direction: column; margin-right: 10px;">
				<select id="examples" style="margin-bottom: 10px;">
					<option value="">Load an example...</option>
					<optgroup label="Language">
						<option>helloWorld</option>
						<option>fizzBuzz</option>
						<option>functions</option>
						<option>arrays</option>
						<option>mathFunctions</option>
						<option>prefixPostfixTest</option>
					</optgroup>
					<optgroup label="Algorithms">
						<option>fibonacci</option>
						<option>isPrime</option>
						<option>primeSieve</option>
						<option>collatz</option>
						<option>towersOfHanoi</option>
						<option>bubbleSort</option>
						<option>insertionSort</option>
						<option>binarySearch</option>
					</optgroup>
					<optgroup label="Graphics &amp; sound">
						<option>drawing</option>
						<option>bouncingBalls</option>
						<option>mouseFollower</option>
						<option>starfield</option>
						<option>fireworks</option>
						<option>gameOfLife</option>
						<option>spriteAnimation</option>
						<option>music</option>
					</optgroup>
					<optgroup label="Games">
						<option>pong</option>
						<option>snake</option>
						<option>breakout</option>
						<option>flappy</option>
						<option>dodger</option>
					</optgroup>
				</select>
<textarea name="code" id="code" spellcheck="false" style="width: 320px; height: 360px;">
PRINT "HELLO, OneShot🏹"

# SPRITES
SPRITE "CIRCLE"
	SIZE 4, 4
	FRAME "FIRST"
		COLORDATA "#", "#00FF00"
		PIXELDATA " ## "
		PIXELDATA "####"
		PIXELDATA "####"
		PIXELDATA " ## "
	END
END

WINDOW 300, 150

# VARIABLES
LET X = 0
LET Y = 0
LET RUNNING = TRUE
LET FPS = 60

PRINT "Press ESCAPE To Quit"

WHILE RUNNING THEN
	COLOR "RED"
	FILL ALL
	DRAW X, Y, "CIRCLE", "FIRST"

	IF (INPUT("W")) THEN 
		Y = Y - 1
	END
	IF (INPUT("A")) THEN 
		X = X - 1
	END
	IF (INPUT("S")) THEN 
		Y = Y + 1
	END
	IF (INPUT("D")) THEN
		X = X + 1
	END

	IF (INPUT("ESCAPE")) THEN
		RUNNING = FALSE
	END

	SLEEP 1000 / FPS
END

COLOR "WHITE"
TEXT 95, 75, "GAME OVER!"

PRINT "GAME OVER!"
</textarea>
				<button id="run" style="margin-top: 10px;">Run</button>
				<button id="upload" style="margin-top: 10px;">Upload</button>
				<input type="file" id="file-input" accept=".oneshot" style="display: none;">
			</div>
			
			<!-- Container for Canvas and Preformatted Text -->
			<div style="display: flex; align-items: flex-start;">
				<canvas id="one-shot-canvas" style="border: 1px solid #000; margin-right: 10px;" width="300" height="150"></canvas>
				<pre style="border: 1px solid #000; padding: 10px;"></pre>
			</div>
		</div>
		  
		<script>
			const oneShot = new OneShot('one-shot-canvas');
			const codeArea = document.getElementById('code');
			const runButton = document.getElementById('run');
			const uploadButton = document.getElementById('upload');
			const fileInput = document.getElementById('file-input');

			const output = document.querySelector('pre');
			const examplesSelect = document.getElementById('examples');

			// Redirect print messages and errors to the <pre> tag
			oneShot.onPrint = (message) => {
				output.innerText += `> ${message}\n`;
			}

			oneShot.onError = (error) => {
				output.innerText += `! ${OneShot.formatError(error)}\n`;
			}

			// Running a program stops the one that is already running
			function runCode() {
				output.innerText = '';
				oneShot.run(codeArea.value);
			}

			// Run Button Event
			runButton.addEventListener('click', runCode);

			// Examples are fetched, so the page has to be served over http (not opened as a file)
			examplesSelect.addEventListener('change', async () => {
				const name = examplesSelect.value;
				if (!name) {
					return;
				}

				try {
					const response = await fetch(`examples/${name}.oneshot`);
					if (!response.ok) {
						throw new Error(response.statusText);
					}
					codeArea.value = await response.text();
					runCode();
				} catch (error) {
					output.innerText = `! Could not load ${name}: ${error.message}. Serve this folder over http, e.g. "python3 -m http.server"\n`;
				}

				// Give the keyboard back to the game
				examplesSelect.blur();
			});

			// Upload Button Event
			uploadButton.addEventListener('click', () => {
				fileInput.click();  // Trigger file input click
			});

			// File Input Change Event
			fileInput.addEventListener('change', (event) => {
				const file = event.target.files[0];

				if (file) {
					const reader = new FileReader();

					reader.onload = (e) => {
						codeArea.value = e.target.result;  // Set file content to textarea
					};

					reader.readAsText(file);  // Read file as plain text
				}
			});

			codeArea.addEventListener('keydown', (event) => {
				if (event.key == 'Tab') {
					event.preventDefault();
					const textarea = event.target;
					const start = textarea.selectionStart;
					const end = textarea.selectionEnd;

					// Insert 4 spaces at the cursor position
					textarea.value = textarea.value.substring(0, start) + "    " + textarea.value.substring(end);

					// Move the cursor after the inserted spaces
					textarea.selectionStart = textarea.selectionEnd = start + 4;
				}
			});

			// Auto-run the default code on page load
			runCode();
		</script>
	</body>
</html>
